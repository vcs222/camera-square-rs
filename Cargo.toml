[package]
name = "camera-square-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Camera Square Raspberry Pi touchscreen camera UI"
homepage = "https://github.com/vcs222/camera-square-rs"
repository = "https://github.com/vcs222/camera-square-rs"
documentation = "https://github.com/vcs222/camera-square-rs#readme"
license = "MIT"
exclude = ["photos/**"]

[dependencies]
libc = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libcamera = { version = "0.7.0", features = ["vendor_draft"], optional = true }
turbojpeg = { version = "1.5.1", optional = true }
tiff = { version = "0.11.3", default-features = false, optional = true }

[features]
native-camera = ["dep:libcamera", "dep:turbojpeg", "dep:tiff"]

[profile.release]
opt-level = 2
lto = false
codegen-units = 4
strip = true
